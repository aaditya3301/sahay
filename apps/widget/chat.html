<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  @font-face { font-family: 'Store Bricolage'; src: url('/fonts/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
  /* Theme tokens. Classic follows the brand colour; boutique and heritage are complete looks. */
  :root {
    --c: #4f46e5;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --bg: #f6f7f9; --surface: #fff; --ink: #0f172a; --muted: #64748b; --line: #e5e7eb;
    --hd-bg: var(--c); --hd-ink: #fff; --hd-sub: rgba(255,255,255,.8); --hd-line: transparent;
    --av-bg: rgba(255,255,255,.2); --av-ink: #fff; --dot: rgba(255,255,255,.6); --spark: var(--c);
    --me-bg: var(--c); --me-ink: #fff;
    --soft: color-mix(in srgb, var(--c) 10%, #fff); --soft-ink: var(--c);
    --action: var(--c); --action-ink: #fff; --accent: var(--c); --photo: #eef0f3;
    --shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  [data-theme=boutique] {
    --font: 'Store Bricolage', Inter, system-ui, sans-serif;
    --bg: #fcf7f3; --surface: #fff; --ink: #362c29; --muted: #8a726b; --line: #efe1da;
    --hd-bg: #fcf7f3; --hd-ink: #362c29; --hd-sub: #8a726b; --hd-line: #efe1da;
    --av-bg: #f2dbd3; --av-ink: #362c29; --dot: #e8590c; --spark: #e8590c;
    --me-bg: #362c29; --me-ink: #fcf7f3;
    --soft: #f6e6df; --soft-ink: #362c29;
    --action: #362c29; --action-ink: #fcf7f3; --accent: #c4480a; --photo: #ece7df;
    --shadow: 0 1px 2px rgba(54,44,41,.06), 0 6px 18px -10px rgba(54,44,41,.18);
  }
  [data-theme=heritage] {
    --font: 'Store Bricolage', Inter, system-ui, sans-serif;
    --bg: #f4f5ec; --surface: #fffef8; --ink: #203f2c; --muted: #5d6e5a; --line: #e1e5d5;
    --hd-bg: #203f2c; --hd-ink: #f4f5ec; --hd-sub: rgba(244,245,236,.72); --hd-line: transparent;
    --av-bg: #f4f5ec; --av-ink: #203f2c; --dot: #9cc59a; --spark: #2b8a3e;
    --me-bg: #203f2c; --me-ink: #f4f5ec;
    --soft: #e3e9da; --soft-ink: #203f2c;
    --action: #203f2c; --action-ink: #f4f5ec; --accent: #2b6e3a; --photo: #e8e7df;
    --shadow: 0 1px 2px rgba(32,63,44,.06), 0 6px 18px -10px rgba(32,63,44,.2);
  }
  * { box-sizing: border-box; font-family: var(--font); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; }
  .app { position: relative; display: flex; flex-direction: column; height: 100%; }
  .full .app { max-width: 720px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

  .hd { background: var(--hd-bg); color: var(--hd-ink); padding: 16px 12px 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--hd-line); }
  .hd .av { position: relative; flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; background: var(--av-bg); color: var(--av-ink); display: grid; place-items: center; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .hd .av::after { content: ''; position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: #3fb36b; box-shadow: 0 0 0 2.5px var(--hd-bg); }
  .hd-t { min-width: 0; }
  .hd b { display: block; font-size: 18px; font-weight: 750; letter-spacing: -.035em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd b .dot { color: var(--dot); }
  .hd-t > span { display: block; margin-top: 2px; font-size: 12px; color: var(--hd-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd #reset { margin-left: auto; }
  .hd #reset + .x { margin-left: 0; }
  .hd .x { margin-left: auto; flex-shrink: 0; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: transparent; border: 0; color: inherit; cursor: pointer; opacity: .75; transition: background .15s, opacity .15s; }
  .hd .x:hover { opacity: 1; background: color-mix(in srgb, currentColor 10%, transparent); }

  .body { flex: 1; overflow-y: auto; padding: 18px 14px 10px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .m { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .in { align-self: flex-end; background: var(--me-bg); color: var(--me-ink); border-bottom-right-radius: 6px; }
  .out { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .out a { color: var(--accent); text-underline-offset: 2px; }
  .who { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--muted); margin-bottom: 3px; }
  .who .spark { color: var(--spark); font-size: 10px; }

  .quick { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; max-width: 92%; }
  .quick button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .quick button:hover { background: var(--action); color: var(--action-ink); border-color: var(--action); }

  .cards { align-self: stretch; flex-shrink: 0; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding: 0 14px; margin: 0 -14px; padding: 2px 14px 8px; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 160px; scroll-snap-align: start; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
  .card .ph { position: relative; aspect-ratio: 5 / 4; background: var(--photo); display: grid; place-items: center; overflow: hidden; }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.16,1,.3,1); }
  .card:hover .ph img { transform: scale(1.05); }
  .card .mono { font-size: 30px; font-weight: 700; letter-spacing: -.05em; color: color-mix(in srgb, var(--ink) 35%, transparent); }
  .card .tag { position: absolute; left: 8px; top: 8px; background: rgba(255,255,255,.92); color: #9f2a1f; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 3px 8px; }
  .card .bd { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; }
  .card .t { font-size: 13.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .card .p { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .card .s { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .card .s::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #3fb36b; }
  .card .s.no::before { background: #d14a3a; }
  .card button { margin-top: auto; width: 100%; border: 0; background: var(--soft); color: var(--soft-ink); border-radius: 999px; padding: 8px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; }
  .card button:hover { background: var(--action); color: var(--action-ink); }

  .verify { align-self: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; font-size: 13.5px; display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow); }
  .verify input { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; outline: none; }
  .verify input:focus { border-color: var(--action); }
  .verify button, .pri { background: var(--action); color: var(--action-ink); border: 0; border-radius: 999px; padding: 10px; font-weight: 600; cursor: pointer; }
  .hint { font-size: 12px; color: var(--muted); } .err { font-size: 12px; color: #b42318; }
  .chip { align-self: flex-start; font-size: 12px; color: #15803d; background: #effaf2; border: 1px solid #c6ecd1; border-radius: 999px; padding: 4px 10px; }
  .typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 13px 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .typing i { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: b 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%, 80%, 100% { opacity: .25; transform: translateY(0) } 40% { opacity: 1; transform: translateY(-2px) } }
  .center { margin: auto; text-align: center; color: var(--muted); font-size: 14px; padding: 24px; }

  .dock { padding: 8px 12px 0; background: var(--bg); }
  .ctx { display: inline-block; max-width: 100%; margin: 0 0 8px 4px; font-size: 11.5px; color: var(--soft-ink); background: var(--soft); border-radius: 999px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ft { display: flex; gap: 4px; align-items: center; padding: 5px 5px 5px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .ft:focus-within { border-color: color-mix(in srgb, var(--action) 45%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--action) 10%, transparent); }
  .ft input[type=text] { flex: 1; min-width: 0; width: 0; border: 0; background: transparent; color: var(--ink); padding: 9px 4px; font-size: 14.5px; outline: none; }
  .ft input[type=text]::placeholder { color: var(--muted); opacity: .8; }
  .att { display: grid; place-items: center; flex-shrink: 0; width: 34px; height: 36px; border-radius: 50%; cursor: pointer; color: var(--muted); padding: 0; border: 0; background: transparent; }
  .att:hover { color: var(--ink); }
  .send { flex-shrink: 0; display: grid; place-items: center; background: var(--action); color: var(--action-ink); border: 0; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; transition: transform .15s; }
  .send:hover { transform: scale(1.05); }
  .ft button:focus-visible, .quick button:focus-visible, .card button:focus-visible, .hd .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ft button:active { transform: translateY(1px); }
  .pw { font-size: 10.5px; text-align: center; color: var(--muted); opacity: .75; padding: 7px 0 9px; background: var(--bg); letter-spacing: .01em; }
  @media (max-width: 340px) { .dock { padding-inline: 8px; } }

    @media (prefers-reduced-motion: reduce) { .typing i, .card .ph img { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="hd"><div class="av" id="av">S</div><div class="hd-t"><b id="title">Chat</b><span id="sub">Replies in seconds · Hindi, Hinglish or English</span></div>
    <button class="x" id="reset" title="Start a new chat" aria-label="Start a new chat" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="x" id="close" title="Close" aria-label="Close" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="body" id="body"><div class="center">Connecting…</div></div>
  <div class="dock">
    <div class="ctx" id="ctx" style="display:none"></div>
    <div class="ft" id="ft" style="display:none">
      <button class="att" id="attach" type="button" title="Attach a photo" aria-label="Attach a photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-9 9a6 6 0 0 1-8.5-8.5L13 2a4 4 0 0 1 5.7 5.7L9 17.4a2 2 0 0 1-2.8-2.8l8.9-8.9"/></svg></button>
      <input type="file" id="file" accept="image/*" hidden>
      <input type="text" id="input" aria-label="Your message" placeholder="Type your message…" autocomplete="off">
      <button class="send" id="send" aria-label="Send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <p class="voice-hint" id="voice-hint" role="status" hidden></p>
  <div class="pw">AI assistant · powered by Sahay</div>
</div>
<script>
(function () {
  var path = location.pathname.split('/');
  var mode = path[1] === 'r' ? 'reply_now' : 'widget';
  var KEY = mode === 'widget' ? decodeURIComponent(path[2] || '') : null;
  var REPLY = mode === 'reply_now' ? path.slice(2).join('/') : null;
  var params = new URLSearchParams(location.search);
  var embedded = window.parent !== window;
  var $ = function (id) { return document.getElementById(id); };
  var body = $('body'), input = $('input'), file = $('file');
  var S = { session: null, cfg: null, context: {}, user: null, userHash: null, lastSig: '', pending: null, seen: {}, verifyOpen: false, started: false };
  // The loader passes the theme in the URL so the first paint is already on-brand; the session config confirms it
  function theme(name, color) {
    if (color) document.documentElement.style.setProperty('--c', color);
    document.documentElement.dataset.theme = /^(boutique|heritage)$/.test(name || '') ? name : 'classic';
  }
  theme(params.get('theme'), params.get('c'));
  if (mode === 'reply_now' || !embedded) document.documentElement.classList.add('full');
  if (embedded && mode === 'widget' && !params.get('playground')) $('close').style.display = 'block';
  $('close').onclick = function () { parent.postMessage({ type: 'sahay:close' }, '*'); };

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function emit(name, data) { if (embedded) parent.postMessage({ type: 'sahay:event', name: name, data: data }, '*'); }
  function parentOrigin() {
    var o = params.get('origin');
    if (!o && document.referrer) { try { o = new URL(document.referrer).origin; } catch (e) {} }
    return o || location.origin;
  }

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'sahay:init') { S.user = d.user; S.userHash = d.userHash; S.context = d.context || {}; showCtx(); start(); }
    else if (d.type === 'sahay:cart') { S.cart = d.cart; pushCart(); }
    else if (d.type === 'sahay:context') { S.context = d.context || {}; showCtx(); }
    else if (d.type === 'sahay:opened') { poll(); setTimeout(function () { input.focus(); }, 50); }
  });
  function showCtx() {
    var t = S.context.product_title || (S.context.product && S.context.product.title);
    $('ctx').style.display = t ? 'block' : 'none';
    $('ctx').textContent = t ? 'Asking about: ' + t : '';
  }

  function pushCart() {
    if (!S.session || !S.cart) return;
    var c = S.cart;
    api('/v1/widget/cart', { session: S.session, items: c.items || [], name: c.name, phone: c.phone, email: c.email, checkout_url: c.checkoutUrl })
      .then(function (j) { emit('cart_saved', j); }).catch(function () {});
  }

  // Bot check: find a counter so sha256(challenge:counter) starts with `bits` zero bits (~0.2s for a person, expensive at bot scale).
  function sha256(ascii) {
    var K = sha256.k || (sha256.k = (function () { var k = [], n = 2, c = 0; while (c < 64) { var p = true; for (var i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; }
      if (p) { k[c++] = (Math.pow(n, 1 / 3) * 4294967296) | 0; } n++; } return k; })());
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var bytes = []; for (var i = 0; i < ascii.length; i++) bytes.push(ascii.charCodeAt(i) & 255);
    var bitLen = bytes.length * 8; bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 255);
    var w = new Array(64);
    for (var o = 0; o < bytes.length; o += 64) {
      for (i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
      for (i = 16; i < 64; i++) { var a = w[i - 15], b = w[i - 2];
        var s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3), s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      var h0 = H[0], h1 = H[1], h2 = H[2], h3 = H[3], h4 = H[4], h5 = H[5], h6 = H[6], h7 = H[7];
      for (i = 0; i < 64; i++) {
        var S1 = ((h4 >>> 6) | (h4 << 26)) ^ ((h4 >>> 11) | (h4 << 21)) ^ ((h4 >>> 25) | (h4 << 7)), ch = (h4 & h5) ^ (~h4 & h6);
        var t1 = (h7 + S1 + ch + K[i] + w[i]) | 0;
        var S0 = ((h0 >>> 2) | (h0 << 30)) ^ ((h0 >>> 13) | (h0 << 19)) ^ ((h0 >>> 22) | (h0 << 10)), mj = (h0 & h1) ^ (h0 & h2) ^ (h1 & h2);
        var t2 = (S0 + mj) | 0;
        h7 = h6; h6 = h5; h5 = h4; h4 = (h3 + t1) | 0; h3 = h2; h2 = h1; h1 = h0; h0 = (t1 + t2) | 0; }
      H[0] = (H[0] + h0) | 0; H[1] = (H[1] + h1) | 0; H[2] = (H[2] + h2) | 0; H[3] = (H[3] + h3) | 0;
      H[4] = (H[4] + h4) | 0; H[5] = (H[5] + h5) | 0; H[6] = (H[6] + h6) | 0; H[7] = (H[7] + h7) | 0;
    }
    return H[0] >>> 0;  // only the first 32 bits are needed for the leading-zero check
  }
  function botCheck() {
    if (REPLY) return Promise.resolve({});
    return fetch('/v1/widget/challenge').then(function (r) { return r.json(); }).then(function (c) {
      if (c.turnstile_site_key) return turnstile(c.turnstile_site_key);
      var limit = Math.pow(2, 32 - c.bits), n = 0;
      while (sha256(c.challenge + ':' + n) >= limit) n++;
      return { pow_challenge: c.challenge, pow_counter: String(n) };
    }).catch(function () { return {}; });
  }
  function turnstile(siteKey) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onload = function () {
        var box = el('div'); box.style.cssText = 'position:fixed;bottom:4px;left:4px;z-index:9'; document.body.appendChild(box);
        window.turnstile.render(box, { sitekey: siteKey, size: 'compact', callback: function (t) { resolve({ turnstile_token: t }); box.remove(); } });
      };
      document.head.appendChild(s);
    });
  }

  function start() {
    if (S.started) return; S.started = true;
    var vkey = 'sahay_v_' + (KEY || 'reply');
    var visitor = store(vkey);
    if (!visitor) { visitor = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36); store(vkey, visitor); }
    botCheck().then(function (proof) { return fetch('/v1/widget/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({
      key: KEY, reply_token: REPLY, visitor_id: visitor, parent_origin: parentOrigin(), user: S.user, user_hash: S.userHash }, proof)) }); })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || 'Could not start chat'); return j; }); })
      .then(function (j) {
        S.session = j.session; S.cfg = j.config; S.verified = j.verified; S.mode = j.mode;
        theme(j.config.theme, j.config.brand_color || '#4f46e5');
        $('title').innerHTML = esc(j.config.name) + '<span class="dot">.</span>'; document.title = j.config.name + ' · chat';
        $('av').textContent = (j.config.agent_name || 'S').slice(0, 1).toUpperCase();
        $('sub').textContent = (j.config.agent_name || 'Assistant') + ' is online · Hindi, Hinglish or English';
        $('ft').style.display = 'flex'; $('reset').style.display = 'grid';
        render([]); poll(); setInterval(poll, 2000); pushCart();
      })
      .catch(function (err) { body.innerHTML = '<div class="center">' + esc(err.message) + '</div>'; });
  }
  if (mode === 'reply_now' || !embedded || params.get('playground')) start();
  else { parent.postMessage({ type: 'sahay:ready' }, '*'); setTimeout(start, 1500); }

  function greeting() {
    var g = el('div', 'm out'); g.innerHTML = '<div class="who">' + esc(S.cfg.agent_name) + '</div>' + fmt(S.cfg.greeting); return g;
  }
  function quickReplies() {
    var row = el('div', 'quick');
    (S.mode === 'reply_now' ? ['Bulk pricing', 'Book a call', 'What do you sell?'] : ['Where is my order?', 'Help me choose', 'Return or replace'])
      .forEach(function (t) { var b = el('button', null, esc(t)); b.type = 'button'; b.onclick = function () { send(t); }; row.appendChild(b); });
    return row;
  }
  function render(msgs, typing) {
    var atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 80;
    body.innerHTML = ''; body.appendChild(greeting());
    if (!msgs.length && !typing) body.appendChild(quickReplies());
    var lastVerify = -1;
    msgs.forEach(function (m, i) { if (m.direction === 'out' && m.interactive && m.interactive.verify_phone) lastVerify = i; });
    msgs.forEach(function (m, i) {
      var div = el('div', 'm ' + (m.direction === 'in' ? 'in' : 'out'));
      var html = m.direction === 'out' ? '<div class="who">' + (m.author_type === 'ai' ? '<span class="spark" aria-hidden="true">✦</span>' + esc(S.cfg.agent_name) : esc(m.author_name || S.cfg.name + ' team')) + '</div>' : '';
      (m.attachments || []).forEach(function (a) { if (a.kind === 'image' && m.direction === 'in') html += '<div class="hint" style="color:inherit">📷 photo sent</div>'; });
      div.innerHTML = html + fmt(m.text || '');
      body.appendChild(div);
      var ui = m.direction === 'out' ? (m.interactive || {}) : {};
      if (ui.products && ui.products.length) body.appendChild(cards(ui.products));
      if (ui.lead_captured) {
        body.appendChild(el('div', 'chip', '✓ Your details are with the team'));
        if (!S.seen[m.id]) { S.seen[m.id] = 1; emit('lead_captured', { message_id: m.id }); }
      }
      if (ui.verify_phone && i === lastVerify && !S.verified) body.appendChild(verifyForm());
    });
    if (typing) body.appendChild(el('div', 'typing', '<i></i><i></i><i></i>'));
    if (atBottom || !S.rendered) body.scrollTop = 1e9;
    S.rendered = true;
  }
  function cards(items) {
    var row = el('div', 'cards');
    items.forEach(function (p) {
      var initials = String(p.title || '?').split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase();
      var c = el('div', 'card', '<div class="ph">' + (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy">' : '<span class="mono">' + esc(initials) + '</span>') +
        (p.in_stock ? '' : '<span class="tag">Sold out</span>') + '</div>' +
        '<div class="bd"><div class="t">' + esc(p.title) + '</div><div class="row"><span class="p">₹' + Number(p.price_inr).toLocaleString('en-IN') + '</span>' +
        '<span class="s' + (p.in_stock ? '' : ' no') + '">' + (p.in_stock ? 'In stock' : 'Out of stock') + '</span></div></div>');
      var img = c.querySelector('img');
      if (img) img.onerror = function () { img.replaceWith(el('span', 'mono', esc(initials))); };
      var b = el('button', null, 'Tell me more'); b.type = 'button';
      b.onclick = function () { S.context.product_sku = p.sku; S.context.product_title = p.title; showCtx(); send('Tell me more about ' + p.title); };
      c.querySelector('.bd').appendChild(b); row.appendChild(c);
    });
    return row;
  }
  function verifyForm() {
    var box = el('div', 'verify', '<b>Verify your phone to see your orders</b><span class="hint">Use the number you ordered with. We\'ll send a 6-digit code.</span>');
    var ph = el('input'); ph.placeholder = '10-digit mobile number'; ph.inputMode = 'tel';
    var btn = el('button', null, 'Send code'); var msg = el('div', 'err');
    box.appendChild(ph); box.appendChild(btn); box.appendChild(msg);
    btn.onclick = function () {
      msg.textContent = '';
      api('/v1/widget/otp/start', { session: S.session, phone: ph.value }).then(function (j) {
        box.innerHTML = '<b>Enter the code</b><span class="hint">' + (j.demo_code ? 'Demo mode (SMS not connected yet): your code is <b>' + j.demo_code + '</b>' : 'We sent it to your phone.') + '</span>';
        var code = el('input'); code.placeholder = '6-digit code'; code.inputMode = 'numeric';
        var go = el('button', null, 'Verify'); var err = el('div', 'err');
        box.appendChild(code); box.appendChild(go); box.appendChild(err);
        go.onclick = function () {
          api('/v1/widget/otp/verify', { session: S.session, phone: ph.value, code: code.value }).then(function (v) {
            S.session = v.session; S.verified = true; S.lastSig = '';
            send('I have verified my phone number.');
          }).catch(function (e) { err.textContent = e.message; });
        };
      }).catch(function (e) { msg.textContent = e.message; });
    };
    return box;
  }
  function api(url, data) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || 'Something went wrong'); return j; }); });
  }
  function poll() {
    if (!S.session) return;
    fetch('/v1/widget/poll?session=' + encodeURIComponent(S.session)).then(function (r) { return r.json(); }).then(function (d) {
      var msgs = d.messages || [];
      var sig = msgs.length + '|' + (d.typing ? 't' : '') + '|' + (S.verified ? 'v' : '');
      if (sig === S.lastSig) return;
      var newOut = msgs.length && msgs[msgs.length - 1].direction === 'out' && S.lastSig && msgs.length > (+S.lastSig.split('|')[0] || 0);
      S.lastSig = sig; render(msgs, d.typing);
      if (newOut) emit('message', { text: msgs[msgs.length - 1].text });
    }).catch(function () {});
  }
  function send(text) {
    if (!S.session || (!text.trim() && !S.pending)) return;
    var fd = new FormData();
    fd.append('session', S.session); fd.append('text', text);
    fd.append('context', JSON.stringify(Object.assign({ source: mode }, S.context)));
    if (S.pending) fd.append('file', S.pending);
    var quick = body.querySelector('.quick'); if (quick) quick.remove();
    var bubble = el('div', 'm in', esc(text || '📷 photo')); body.appendChild(bubble);
    body.appendChild(el('div', 'typing', '<i></i><i></i><i></i>')); body.scrollTop = 1e9;
    S.pending = null; file.value = ''; input.placeholder = 'Type your message…';
    fetch('/v1/widget/send', { method: 'POST', body: fd }).then(function (r) {
      if (r.status === 429) r.json().then(function (j) { bubble.insertAdjacentHTML('afterend', '<div class="err">' + esc(j.detail || 'Slow down a little and try again.') + '</div>'); });
      setTimeout(poll, 600);
    });
  }
  // ---- "Talk to us": a voice call in the browser (same agent, tools and rules; no phone line needed) ----
  var V = { id: null, rec: null, live: false, lang: 'hi-IN' };
  function vstate(t, live) { $('vst').textContent = t; $('orb').classList.toggle('live', !!live); }
  function vline(cls, t) { var d = el('div', cls, esc(t)); $('vlines').appendChild(d); $('vlines').scrollTop = 1e9; }
  function speak(text, then) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = V.lang; var vs = speechSynthesis.getVoices().filter(function (v) { return v.lang === V.lang; }); if (vs.length) u.voice = vs[0];
    u.onend = function () { if (V.live && then) then(); };
    vstate('Speaking…', true); speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  function listen() {
    if (!V.live) return;
    var R = window.SpeechRecognition || window.webkitSpeechRecognition;
    V.rec = new R(); V.rec.lang = V.lang === 'hi-IN' ? 'en-IN' : V.lang; V.rec.interimResults = false; V.rec.maxAlternatives = 1;
    var heard = false;
    V.rec.onresult = function (e) { heard = true; var t = e.results[0][0].transcript; vline('u', t); turn(t); };
    V.rec.onend = function () { if (V.live && !heard) listen(); };
    V.rec.onerror = function (e) { if (e.error === 'not-allowed') { vstate('Microphone blocked. Allow it and try again.'); V.live = false; } };
    vstate('Listening…', true); V.rec.start();
  }
  function turn(text) {
    vstate('Thinking…', false);
    var slow = setTimeout(function () { speak(V.lang === 'hi-IN' ? 'Ek second, check kar rahi hoon.' : 'One second, let me check.'); }, 1400);
    api('/v1/widget/voice/turn', { session: S.session, call_id: V.id, text: text }).then(function (r) {
      clearTimeout(slow); vline('a', r.say);
      speak(r.say, r.end_call ? endCall : listen);
    }).catch(function (e) { clearTimeout(slow); vstate(e.message); });
  }
  function endCall() {
    V.live = false; try { V.rec && V.rec.abort(); } catch (e) {} speechSynthesis.cancel();
    if (V.id) api('/v1/widget/voice/end', { session: S.session, call_id: V.id }).catch(function () {});
    V.id = null; $('vc').classList.remove('on'); $('mic').focus(); S.lastSig = ''; poll();
  }
  $('mic').onclick = function () {
    if ($('mic').disabled || V.live) return;
    $('vlines').innerHTML = ''; $('vc').classList.add('on'); $('vend').focus(); vstate('Connecting…'); V.live = true;
    api('/v1/widget/voice/start', { session: S.session }).then(function (r) {
      V.id = r.call_id; V.lang = r.lang || 'hi-IN'; vline('a', r.greeting); speak(r.greeting, listen);
    }).catch(function (e) { vstate(e.message); V.live = false; });
  };
  $('vend').onclick = endCall;

  $('attach').onclick = function () { file.click(); };

  $('send').onclick = function () { var t = input.value; input.value = ''; send(t); };
  input.onkeydown = function (e) { if (e.key === 'Enter') { var t = input.value; input.value = ''; send(t); } };
  file.onchange = function () { S.pending = file.files[0]; if (S.pending) input.placeholder = '📷 ' + S.pending.name + ' — add a message'; };
})();
</script>
</body>
